# Scratch: line-level profile of the person pass on x86. Not for main.
name: bench-x86
on: { push: { branches: [bench-x86] }, workflow_dispatch: {} }
jobs:
  x86:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env: { RF: "-C target-cpu=x86-64-v3 -C target-feature=+crt-static", T: x86_64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: setup
        run: |
          lscpu | grep -E "Model name|^CPU\(s\)"
          sudo apt-get -qq install -y linux-tools-common linux-tools-$(uname -r) binutils >/dev/null 2>&1 || true
          sudo sysctl -q kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0 || true
          (cd bench/x86/generator && cargo build -q --release && ./target/release/generate --seed 3 --events 20000000 --clicks 5000000 --output /tmp/s3 >/dev/null)
          git worktree add -q /tmp/wt origin/main
          (cd /tmp/wt/engine && CARGO_PROFILE_RELEASE_DEBUG=1 RUSTFLAGS="$RF -C relocation-model=static" cargo build -q --release --locked --target $T 2>/dev/null && cp target/$T/release/shopping-engine /tmp/dbg)
      - name: profile
        run: |
          SE_TIMING=1 /tmp/dbg /tmp/s3 /tmp/o 2>&1 | grep -E "prof|timing\] (parse|dedup|people)"
          sudo perf record -q -F 9999 -o /tmp/perf.data /tmp/dbg /tmp/s3 /tmp/o >/dev/null 2>&1
          sudo perf script -i /tmp/perf.data -F ip 2>/dev/null > /tmp/ips.txt; wc -l /tmp/ips.txt
          python3 bench/x86/lineprof.py /tmp/dbg person.rs < /tmp/ips.txt
