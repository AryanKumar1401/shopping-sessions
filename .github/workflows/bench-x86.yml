# Scratch: real-x86 gate + A/B of a new main commit against the last verified one. Not for main.
#   gh workflow run bench-x86 --ref bench-x86 -f old=<sha> -f new=<sha>
name: bench-x86
on:
  workflow_dispatch:
    inputs:
      old: { description: "last verified commit", required: true }
      new: { description: "commit to check", required: true }
jobs:
  x86:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env: { RUSTFLAGS: "-C target-cpu=x86-64-v3 -C target-feature=+crt-static", T: x86_64-unknown-linux-gnu, OLD: "${{ inputs.old }}", NEW: "${{ inputs.new }}" }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: setup
        run: |
          lscpu | grep -E "Model name|^CPU\(s\)"
          (cd bench/x86/generator && RUSTFLAGS= cargo build -q --release && ./target/release/generate --seed 3 --events 20000000 --clicks 5000000 --output /tmp/s3 >/dev/null && ./target/release/generate --seed 11 --events 5000000 --clicks 1250000 --output /tmp/s11 >/dev/null && ./target/release/generate --seed 249 --events 1000000 --clicks 250000 --output /tmp/s249 >/dev/null && ./target/release/generate --seed 5 --events 60000000 --clicks 15000000 --output /tmp/s5 >/dev/null)
          mkdir -p out/perf
          for rv in old:$OLD new:$NEW; do n=${rv%%:*}; git worktree add -q --detach /tmp/wt-$n ${rv##*:}; (cd /tmp/wt-$n/engine && CARGO_TARGET_DIR=/tmp/t-$n cargo build -q --release --locked --target $T 2>/dev/null && cp /tmp/t-$n/$T/release/shopping-engine $GITHUB_WORKSPACE/out/perf/$n); done
          python3 -m venv .venv && .venv/bin/pip -q install polars duckdb==1.5.6 pyarrow >/dev/null 2>&1
      - name: correctness of new
        run: |
          PY=.venv/bin/python; W=/tmp/wt-new
          echo "checking $(git -C $W log --oneline -1)"
          # the commit's own fixtures, harness and DuckDB pipeline
          (cd $W && for d in fixtures fixtures_extra; do $GITHUB_WORKSPACE/$PY scripts/run_fixtures.py $d -- $GITHUB_WORKSPACE/out/perf/new | tail -1; done)
          $PY bench/qa_diff_spawn.py --seeds 0:400 --jobs 4 --quiet --no-shrink --impl "target=out/perf/new" | tail -1
          SE_SLOW=1 $PY bench/qa_diff_spawn.py --seeds 0:100 --jobs 4 --quiet --no-shrink --impl "target=out/perf/new" | tail -1
          for t in 1 2 3; do rm -rf /tmp/o; NCPU=$t out/perf/new fixtures/E1/input /tmp/o >/dev/null 2>&1; echo "new NCPU=$t rc=$?"; done
          for d in s3 s11 s249; do out/perf/old /tmp/$d /tmp/a-$d >/dev/null 2>&1; out/perf/new /tmp/$d /tmp/b-$d >/dev/null 2>&1; echo "new $d vs old: $($PY scripts/compare.py /tmp/b-$d /tmp/a-$d 2>&1 | tail -1)"; done
          $PY duck/pipeline.py /tmp/s11 /tmp/duck11 >/dev/null 2>&1; echo "new s11 vs DuckDB: $($PY scripts/compare.py /tmp/b-s11 /tmp/duck11 2>&1 | tail -1)"
      - name: docker image of new (as the scorer runs it)
        run: |
          docker build -q -t ss:new /tmp/wt-new >/dev/null
          rm -rf /tmp/dk; mkdir -p /tmp/dk /tmp/scr && chmod 777 /tmp/dk /tmp/scr
          docker run --rm --network none -v /tmp/s11:/data:ro -v /tmp/dk:/output -v /tmp/scr:/scratch ss:new; echo "docker rc=$?"
          echo "docker s11 vs DuckDB: $(.venv/bin/python scripts/compare.py /tmp/dk /tmp/duck11 2>&1 | tail -1)"
      - name: bench 20M (interleaved)
        run: python3 bench/bench.py --data /tmp/s3 --reps 11 old=out/perf/old new=out/perf/new 2>&1 | grep -vE "^ +(setup|campaign_daily|release|list|tables|links \(join)|rss"
      - name: 60M (the final's size): output and interleaved bench
        run: |
          out/perf/old /tmp/s5 /tmp/a-s5 >/dev/null 2>&1; out/perf/new /tmp/s5 /tmp/b-s5 >/dev/null 2>&1; echo "new s5-60m vs old: $(.venv/bin/python scripts/compare.py /tmp/b-s5 /tmp/a-s5 2>&1 | tail -1)"
          python3 bench/bench.py --data /tmp/s5 --reps 5 old=out/perf/old new=out/perf/new 2>&1 | grep -vE "^ +(setup|campaign_daily|release|list|tables|links \(join)|rss"
