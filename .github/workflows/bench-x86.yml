# Scratch: real-x86 probe of engine candidates (revs in bench/x86/revs). Not for main.
name: bench-x86
on: { push: { branches: [bench-x86] }, workflow_dispatch: {} }
jobs:
  x86:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env: { RUSTFLAGS: "-C target-cpu=x86-64-v3 -C target-feature=+crt-static", T: x86_64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: setup
        run: |
          lscpu | grep -E "Model name|^CPU\(s\)"
          sudo apt-get -qq install -y linux-tools-common linux-tools-$(uname -r) >/dev/null 2>&1 || true
          sudo sysctl -q kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0 || true
          (cd bench/x86/generator && RUSTFLAGS= cargo build -q --release && ./target/release/generate --seed 3 --events 20000000 --clicks 5000000 --output ../../../data/s3-20m >/dev/null)
          mkdir -p out/perf
          for rv in $(cat bench/x86/revs); do
            n=${rv%%:*}; r=${rv##*:}
            git worktree add -q /tmp/wt-$n $r
            (cd /tmp/wt-$n/engine && CARGO_TARGET_DIR=/tmp/tgt cargo build -q --release --locked --target $T 2>/dev/null && cp /tmp/tgt/$T/release/shopping-engine $GITHUB_WORKSPACE/out/perf/$n)
            (cd /tmp/wt-$n/engine && CARGO_PROFILE_RELEASE_DEBUG=line-tables-only CARGO_TARGET_DIR=/tmp/tgtd cargo build -q --release --locked --target $T 2>/dev/null && cp /tmp/tgtd/$T/release/shopping-engine /tmp/$n-dbg)
          done
      - name: bench 20M (interleaved)
        run: python3 bench/bench.py --data data/s3-20m --reps 9 $(for rv in $(grep -v ^skip bench/x86/revs); do n=${rv%%:*}; echo "$n=out/perf/$n"; done) 2>&1 | grep -vE "^ +(setup|campaign_daily|release|list|tables|links \(join)"
      - name: probe
        run: bench/x86/probe.sh
