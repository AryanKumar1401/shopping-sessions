# Scratch: build one commit on real x86, make 20M and 60M data, run a probe script from bench/x86/probes/. Not for main.
#   gh workflow run probe-x86 --ref bench-x86 -f rev=<sha> -f probe=<name>
name: probe-x86
on:
  workflow_dispatch:
    inputs:
      rev: { description: "commit to build", required: true }
      probe: { description: "script in bench/x86/probes", required: true }
jobs:
  x86:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env: { RUSTFLAGS: "-C target-cpu=x86-64-v3 -C target-feature=+crt-static", T: x86_64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: setup
        run: |
          lscpu | grep -E "Model name|^CPU\(s\)"
          (cd bench/x86/generator && RUSTFLAGS= cargo build -q --release && ./target/release/generate --seed 3 --events 20000000 --clicks 5000000 --output /tmp/s3 >/dev/null && ./target/release/generate --seed 5 --events 60000000 --clicks 15000000 --output /tmp/s5 >/dev/null)
          git worktree add -q --detach /tmp/wt ${{ inputs.rev }}
          (cd /tmp/wt/engine && CARGO_TARGET_DIR=/tmp/t cargo build -q --release --locked --target $T 2>/dev/null && cp /tmp/t/$T/release/shopping-engine /tmp/eng)
      - name: probe
        run: bash bench/x86/probes/${{ inputs.probe }}.sh
